services:
  postgres:
    image: postgres:16-alpine
    container_name: fines-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fines
      POSTGRES_PASSWORD: fines123
      POSTGRES_DB: fines_adultos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
